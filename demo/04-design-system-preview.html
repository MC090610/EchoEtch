<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聲畫合鳴 · doc04 设计系统互动预览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   共享 TOKEN 系统（faithful 复制 docs/04 实测值）
   :root 默认 = 青年清透（demo1 视觉标杆）
   [data-tier="..."] 覆写四套
   ============================================================ */
:root {
  /* 全局基础（与分层无关） */
  --page-width: 375px;
  --page-height: 812px;
  --safe-bottom: env(safe-area-inset-bottom, 8px);
  --radius-sm: 12px; --radius-md: 16px; --radius-lg: 24px; --radius-full: 9999px;
  --shadow-light: 0 2px 8px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
  --shadow-float: 0 8px 32px rgba(0,0,0,0.10);
  --ease: cubic-bezier(0.4,0,0.2,1);
  --ease-out: cubic-bezier(0,0,0.2,1);
  --z-nav: 200; --z-fab: 150; --z-overlay: 300;

  /* 默认 = 青年清透（demo1 实测） */
  --bg: #FAF8F5;
  --surface: #F0F4F8;
  --fg: #2D3748;
  --muted: #8B9AAF;
  --border: #E2E8F0;
  --accent: #8BC6A0;
  --accent-soft: #D4EDDA;
  --accent-deep: #6BA882;
  --accent-rgb: 139, 198, 160;
  --radius: 16px; --radius-lg: 24px;
  --font-display: 'Noto Serif SC', serif;
  --font-body: 'Noto Sans SC', system-ui, sans-serif;
  --base-font-size: 15px;
  --touch-min: 44px;
  --motion-level: 0.8;
  --sprout-duration: 3s;
  --paper-texture: none;
  --frame-shadow: 0 0 60px rgba(0,0,0,0.08);

  /* 分层文案（content 用） */
  --tier-greeting: '晚好，今夜允许和自己独处 🌙';
  --tier-sprout-text: '正在收纳今日细碎心绪';
  --tier-stage: '花苞期';
  --nav-write: '书写';
  --nav-archive: '档案馆';
}

/* 少儿奶柔（demo2 实测） */
[data-tier="children"] {
  --bg: #FFF9F2; --surface: #FFF3E8; --fg: #4A3728; --muted: #B8A090; --border: #F0E0D0;
  --accent: #F5A0B8; --accent-soft: #FDE8EF; --accent-deep: #F0909A; --accent-rgb: 245, 160, 184;
  --radius: 24px; --radius-lg: 32px;
  --font-display: 'Nunito', 'Noto Sans SC', sans-serif;
  --font-body: 'Noto Sans SC', sans-serif;
  --base-font-size: 16px; --touch-min: 48px; --motion-level: 1; --sprout-duration: 2.5s;
  --tier-greeting: '早上好呀，今天也要开开心心的哦！';
  --tier-sprout-text: '正在种下你的小开心～';
  --tier-stage: '嫩芽';
  --nav-write: '画画'; --nav-archive: '百宝箱';
}

/* 成人哑光疗愈（demo3 实测） */
[data-tier="adult"] {
  --bg: #F5F0E8; --surface: #EDE8DF; --fg: #3D3228; --muted: #9B8E80; --border: #DDD5C8;
  --accent: #8BA89A; --accent-soft: rgba(139,168,154,0.12); --accent-deep: #5C7A6A; --accent-rgb: 139, 168, 154;
  --radius: 12px; --radius-lg: 18px;
  --font-display: 'Noto Serif SC', serif;
  --font-body: 'Noto Sans SC', system-ui, sans-serif;
  --base-font-size: 14px; --touch-min: 44px; --motion-level: 0.5; --sprout-duration: 4s;
  --paper-texture: repeating-linear-gradient(0deg, transparent 0 2px, rgba(61,50,40,0.025) 2px 4px),
                   repeating-linear-gradient(90deg, transparent 0 2px, rgba(61,50,40,0.02) 2px 4px);
  --frame-shadow: 0 0 0 3px #1a1612, 0 20px 60px rgba(0,0,0,0.5);
  --tier-greeting: '夜深了，留一段时光给自己';
  --tier-sprout-text: '正在沉淀你的专属时光';
  --tier-stage: '盛放期';
  --nav-write: '书写'; --nav-archive: '档案馆';
}

/* 中老年适老康养（demo4 实测） */
[data-tier="elderly"] {
  --bg: #F5EDE0; --surface: #EDE5D8; --fg: #3A2E22; --muted: #8B7B68; --border: #D8CCBC;
  --accent: #6B8F71; --accent-soft: #D4E8D4; --accent-deep: #5A7A60; --accent-rgb: 107, 143, 113;
  --radius: 14px; --radius-lg: 20px;
  --font-display: 'Noto Sans SC', system-ui, sans-serif;
  --font-body: 'Noto Sans SC', system-ui, sans-serif;
  --base-font-size: 18px; --touch-min: 64px; --motion-level: 0.3; --sprout-duration: 5s;
  --tier-greeting: '下午好，今天过得怎么样？';
  --tier-sprout-text: '正在封存今日岁月闲思';
  --tier-stage: '晚岁安和';
  --nav-write: '记录'; --nav-archive: '回忆';
}

/* ============================================================
   基础重置与布局
   ============================================================ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { font-size: var(--base-font-size); }
body {
  font-family: var(--font-body);
  background: #E8E4DF;
  color: var(--fg);
  line-height: 1.6;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px;
  -webkit-font-smoothing: antialiased;
}

/* 顶部控制栏 */
.control-bar {
  width: 100%; max-width: 480px;
  background: #fff;
  border-radius: 16px;
  box-shadow: var(--shadow-md);
  padding: 12px 14px;
  margin-bottom: 18px;
  position: sticky; top: 12px; z-index: 500;
}
.control-title {
  font-size: 13px; font-weight: 600; color: #2D3748;
  margin-bottom: 10px; display:flex; align-items:center; gap:6px;
}
.control-title small { font-weight:400; color:#8A9BA8; font-size:11px; }
.tier-switcher { display:flex; gap:6px; }
.tier-btn {
  flex:1; padding: 9px 4px;
  border: 1.5px solid #E2E8F0; background:#fff;
  border-radius: 10px;
  font-size: 12px; font-weight: 600; color: #6B7B8A;
  cursor: pointer; transition: all .2s;
  font-family: inherit;
}
.tier-btn.active { color:#fff; border-color:transparent; }
.tier-btn[data-tier="children"].active { background:#F5A0B8; }
.tier-btn[data-tier="youth"].active  { background:#8BC6A0; }
.tier-btn[data-tier="adult"].active   { background:#8BA89A; }
.tier-btn[data-tier="elderly"].active  { background:#6B8F71; }
.auto-toggle {
  margin-top: 8px; display:flex; align-items:center; gap:8px;
  font-size: 11px; color:#8A9BA8;
}
.auto-toggle input { cursor:pointer; }
.hint { font-size:11px; color:#9AA5B0; margin-top:6px; line-height:1.4; }

/* 手机框 */
.device {
  width: var(--page-width);
  height: var(--page-height);
  max-width: 100%;
  background: var(--bg);
  border-radius: 32px;
  box-shadow: var(--frame-shadow);
  position: relative;
  overflow: hidden;
  font-family: var(--font-body);
  color: var(--fg);
  transition: background .4s var(--ease);
}
/* 成人纸质纹理 overlay */
.device::before {
  content:''; position:absolute; inset:0;
  background: var(--paper-texture);
  pointer-events:none; z-index:1;
}
@media (max-width: 420px) {
  body { padding: 0; background: var(--bg); }
  .control-bar { margin:0 0 0 0; border-radius:0; max-width:100%; position:static; }
  .device { width:100%; height:100vh; border-radius:0; box-shadow:none; }
}

/* 页面 */
.screen {
  position:absolute; inset:0; z-index:2;
  display:none; flex-direction:column;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom: 90px;
}
.screen::-webkit-scrollbar { display:none; }
.screen.active { display:flex; animation: fadeIn .35s var(--ease) forwards; }
@keyframes fadeIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

/* 顶部内边距 */
.screen-pad { padding: 48px 20px 0; }

/* 问候区 */
.greeting-row { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.greeting {
  font-family: var(--font-display);
  font-size: 24px; font-weight: 600;
  line-height: 1.35; color: var(--fg);
  letter-spacing: -0.01em;
}
.badge {
  display:inline-flex; align-items:center; gap:5px;
  padding: 5px 12px; border-radius: var(--radius-full);
  background: var(--accent-soft); color: var(--accent-deep);
  font-size: 12px; font-weight:600; flex-shrink:0;
}
.badge svg { width:14px; height:14px; }

/* 数据卡 */
.stat-row { display:flex; gap:10px; margin: 18px 0; }
.stat-card {
  flex:1; background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 8px; text-align:center;
}
.stat-num {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 700; color: var(--fg);
  line-height:1.2;
}
.stat-label { font-size: 11px; color: var(--muted); margin-top:3px; }

/* 区段标题 */
.section-row { display:flex; align-items:center; justify-content:space-between; margin: 16px 0 10px; }
.section-title { font-size: 17px; font-weight:600; color: var(--fg); }
.section-meta { font-size: 12px; color: var(--muted); }

/* 时间轴 */
.timeline { display:flex; flex-direction:column; gap:12px; }
.tl-entry {
  display:flex; gap:12px; align-items:center;
  background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius); padding: 12px;
  cursor:pointer; transition: transform .15s;
}
.tl-entry:active { transform: scale(0.98); }
.tl-thumb {
  width: 44px; height:44px; border-radius: var(--radius-sm);
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background: var(--accent-soft);
}
.tl-thumb svg { width:24px; height:24px; }
.tl-body { flex:1; min-width:0; }
.tl-meta { font-size:11px; color:var(--muted); }
.tl-text { font-size:13px; color:var(--fg); line-height:1.5;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* FAB */
.fab {
  position:absolute; bottom: 84px; right: 20px; z-index: var(--z-fab);
  min-width: var(--touch-min); min-height: var(--touch-min);
  width: 56px; height:56px; border-radius:50%;
  background: var(--accent); border:none;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 4px 16px rgba(var(--accent-rgb),0.35);
  cursor:pointer; transition: transform .15s;
}
.fab:active { transform: scale(0.93); }
.fab svg { width:24px; height:24px; color:#fff; }
[data-tier="elderly"] .fab { width:68px; height:68px; }
[data-tier="elderly"] .fab svg { width:30px; height:30px; }

/* 底部导航 */
.bnav {
  position:absolute; bottom:0; left:0; right:0; z-index: var(--z-nav);
  height: 68px; background: rgba(255,255,255,0.0);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display:flex; justify-content:space-around; align-items:center;
  padding-bottom: var(--safe-bottom);
}
[data-tier="elderly"] .bnav { height: 80px; }
.bnav-item {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  min-width: var(--touch-min); min-height: 44px;
  background:none; border:none; cursor:pointer;
  color: var(--muted); font-size:11px; font-family:inherit;
  transition: color .2s;
}
[data-tier="elderly"] .bnav-item { font-size: 14px; }
.bnav-item.active { color: var(--accent-deep); }
.bnav-item svg { width:22px; height:22px; }
[data-tier="elderly"] .bnav-item svg { width:28px; height:28px; }

/* ============ 录入页 ============ */
.journal-header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
.j-date { font-size:13px; color:var(--muted); }
.j-guide { font-family:var(--font-display); font-size:15px; color:var(--muted); margin: 6px 0 16px; }
.j-tabs { display:flex; gap:6px; margin-bottom:14px; }
.j-tab {
  flex:1; padding: 10px 4px;
  border:1.5px solid var(--border); background:var(--surface);
  border-radius: var(--radius-sm);
  font-size:12px; font-weight:500; color:var(--muted);
  cursor:pointer; font-family:inherit; min-height: var(--touch-min);
  transition: all .2s;
}
.j-tab.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); }
.j-input {
  width:100%; min-height:140px;
  background:var(--surface); border:1px solid var(--border);
  border-radius: var(--radius); padding: 14px;
  font-family:inherit; font-size:14px; color:var(--fg);
  resize:none; outline:none; line-height:1.7;
}
.j-input:focus { border-color: var(--accent); }
.gen-btn {
  width:100%; padding: 15px; margin-top: 20px;
  background: var(--accent); color:#fff; border:none;
  border-radius: var(--radius);
  font-size: 15px; font-weight:600; font-family:inherit;
  min-height: var(--touch-min);
  cursor:pointer; letter-spacing:0.04em;
  box-shadow: 0 4px 16px rgba(var(--accent-rgb),0.3);
  transition: transform .15s;
}
.gen-btn:active { transform: scale(0.98); }

/* ============ 发芽页 ============ */
.screen-sprout { align-items:center; justify-content:center; background: var(--bg); }
.sprout-scene { position:relative; width:200px; height:200px; display:flex; align-items:center; justify-content:center; }
.sprout-glow {
  position:absolute; width:140px; height:140px; border-radius:50%;
  background: radial-gradient(circle, rgba(var(--accent-rgb),0.18) 0%, transparent 70%);
  animation: glowPulse 3s ease-in-out infinite;
}
@keyframes glowPulse { 0%,100%{opacity:.5; transform:scale(1);} 50%{opacity:1; transform:scale(1.15);} }
.ink-rings { position:absolute; width:160px; height:160px; }
.ink-ring { fill:none; stroke: var(--accent); stroke-width:1; opacity:0; transform-origin:center; animation: rippleExpand var(--sprout-duration) ease-out infinite; }
.ink-ring:nth-child(2){ animation-delay: .8s; }
.ink-ring:nth-child(3){ animation-delay: 1.6s; }
@keyframes rippleExpand { 0%{opacity:.6; r:20;} 100%{opacity:0; r:80;} }
.sound-rings { position:absolute; width:200px; height:200px; }
.sound-ring { fill:none; stroke: var(--accent); stroke-width:1; opacity:0; animation: soundPulse calc(var(--sprout-duration) * 1.5) ease-out infinite; }
.sound-ring:nth-child(2){ animation-delay: 1s; }
.sound-ring:nth-child(3){ animation-delay: 2s; }
@keyframes soundPulse { 0%{opacity:.4; r:30; stroke-width:1.5;} 100%{opacity:0; r:95; stroke-width:.3;} }
.sprout-svg { width:120px; height:160px; z-index:2; }
.sprout-stem { stroke-dasharray:80; stroke-dashoffset:80; animation: stemGrow calc(var(--sprout-duration) * 0.66) ease forwards .5s; }
@keyframes stemGrow { to{ stroke-dashoffset:0; } }
.sprout-leaf { opacity:0; transform-origin:bottom center; animation: leafOpen calc(var(--sprout-duration) * 0.4) ease forwards calc(var(--sprout-duration) * 0.5); }
.sprout-leaf.r { animation-delay: calc(var(--sprout-duration) * 0.66); }
@keyframes leafOpen { 0%{opacity:0; transform:scale(0.3);} 100%{opacity:1; transform:scale(1);} }
.sprout-text {
  margin-top: 28px; font-family:var(--font-display);
  font-size: 16px; color: var(--muted); letter-spacing:0.04em;
  animation: breathe 3s ease-in-out infinite;
  text-align:center;
}
@keyframes breathe { 0%,100%{opacity:.5;} 50%{opacity:1;} }
/* 适老版弱化为单态缓涟漪 */
[data-tier="elderly"] .sprout-svg, [data-tier="elderly"] .sound-rings { animation-duration: 6s; }
[data-tier="elderly"] .sprout-glow { animation-duration: 5s; }

/* ============ 回声卡片 ============ */
.echo-hero { width:100%; height:200px; border-radius:0; overflow:hidden; }
.echo-hero svg { width:100%; height:100%; display:block; }
.echo-body { padding: 18px 20px; }
.echo-date { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.echo-narrative {
  font-family: var(--font-display);
  font-size: 14px; line-height:1.8; color: var(--fg);
  background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
}
.audio-player {
  display:flex; align-items:center; gap:12px;
  background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius); padding: 12px; margin-bottom:14px;
}
.play-btn {
  min-width: var(--touch-min); min-height: var(--touch-min);
  width:40px; height:40px; border-radius:50%;
  background: var(--accent); border:none; color:#fff;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0;
}
.play-btn svg { width:14px; height:14px; }
.audio-info { flex:1; }
.audio-title { font-size:12px; color:var(--fg); margin-bottom:6px; }
.audio-wave { display:flex; align-items:center; gap:2px; height:18px; }
.audio-wave span { width:2px; border-radius:1px; background:var(--accent); opacity:.5; }
.echo-tags { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.echo-tag { padding:5px 12px; border-radius:var(--radius-full); font-size:12px;
  background: var(--accent-soft); color: var(--accent-deep); }
.echo-actions { display:flex; gap:10px; }
.echo-actions button {
  flex:1; padding:12px; border-radius: var(--radius);
  font-size:13px; font-weight:500; font-family:inherit; cursor:pointer;
  min-height: var(--touch-min); transition: transform .15s;
}
.act-primary { background:var(--accent); color:#fff; border:none; }
.act-outline { background:transparent; color:var(--accent-deep); border:1.5px solid var(--accent); }
.echo-actions button:active { transform: scale(0.98); }
/* 适老朗读按钮（仅适老显示） */
.read-aloud {
  display:none; width:100%; padding:12px; margin-bottom:12px;
  border-radius: var(--radius); font-size:14px; font-weight:600; font-family:inherit;
  background: var(--surface); color: var(--accent-deep); border:2px solid var(--accent);
  cursor:pointer; min-height: var(--touch-min);
}
[data-tier="elderly"] .read-aloud { display:flex; align-items:center; justify-content:center; gap:8px; }

/* ============ 档案馆 ============ */
.arch-title { font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--fg); margin-bottom:14px; }
.arch-summary { display:flex; gap:10px; margin-bottom:20px; }
.arch-stat { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 6px; text-align:center; }
.arch-stat .num { font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--fg); }
.arch-stat .lbl { font-size:11px; color:var(--muted); margin-top:2px; }
.arch-list { display:flex; flex-direction:column; gap:8px; }
.arch-item {
  display:flex; justify-content:space-between; align-items:center;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px 14px; cursor:pointer;
}
.arch-month { font-size:14px; color:var(--fg); }
.arch-count { font-size:12px; color:var(--muted); }
.growth-card {
  margin-top:20px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:18px;
}
.growth-title { font-size:14px; font-weight:600; color:var(--fg); margin-bottom:12px; }
.growth-chart { width:100%; height:80px; margin-bottom:12px; }
.word-cloud { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.wc-word { padding:4px 10px; border-radius:var(--radius-full); font-size:12px;
  background: #fff; color:var(--muted); border:1px solid var(--border); }
.wc-word.accent { background:var(--accent-soft); color:var(--accent-deep); border-color:transparent; }
.growth-text { font-family:var(--font-display); font-size:13px; color:var(--muted); text-align:center; margin-top:10px; line-height:1.7; }

/* reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<!-- ============ 顶部控制栏 ============ -->
<div class="control-bar">
  <div class="control-title">聲畫合鳴 · doc04 设计系统预览 <small>切换分层看四套视觉实时变化</small></div>
  <div class="tier-switcher" id="tierSwitcher">
    <button class="tier-btn" data-tier="children">少儿奶柔</button>

function applyTier(tier) {
  curTier = tier;
  document.getElementById('device').setAttribute('data-tier', tier);
  // 切换器高亮
  document.querySelectorAll('.tier-btn').forEach(b => b.classList.toggle('active', b.dataset.tier === tier));
  const t = TIERS[tier];
  // 文案
  document.getElementById('greeting').textContent = getComputedStyle(document.documentElement).getPropertyValue('--tier-greeting').trim().replace(/^['"]|['"]$/g,'');
  // 由于 content 变量含引号，直接用配置取
  document.getElementById('greeting').textContent = greetingFor(tier);
  ['stageBadge','stageBadge2','stageBadge3','stageStat','stageArch'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent = t.stage; });
  document.getElementById('journalGuide').textContent = t.guide;
  document.getElementById('jInput').placeholder = t.inputPlaceholder;
  document.getElementById('sproutText').textContent = sproutTextFor(tier);
  document.getElementById('navWriteLabel').textContent = navWriteLabel(tier);
  document.getElementById('navArchiveLabel').textContent = navArchiveLabel(tier);
  document.getElementById('audioTitle').textContent = t.audioTitle;
  document.getElementById('echoNarrative').textContent = t.narrative;
  document.getElementById('growthText').textContent = t.growthText;
  // 标签
  document.getElementById('echoTags').innerHTML = t.tags.map(x => `<span class="echo-tag">${x}</span>`).join('');
  // 词云
  document.getElementById('wordCloud').innerHTML = t.wc.map((x,i) => `<span class="wc-word ${i<2?'accent':''}">${x}</span>`).join('');

  buildTabs(t.tabs);

  // 时间轴数据（随分层微调文案）

  // 音频波形
  buildWave();

  }[tier];
  document.getElementById('timeline').innerHTML = data.map(([d,txt]) => `
    <div class="tl-entry" onclick="navigate('echo')">
      <div class="tl-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-deep)" stroke-width="1.5"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></div>
      <div class="tl-body"><div class="tl-meta">${d} · ${tier==='children'?'涂鸦':(tier==='elderly'?'语音':'文字')}</div><div class="tl-text">${txt}</div></div>
    </div>`).join('');
}

function buildWave(){
  const c = document.getElementById('audioWave');
  let h = '';
  for(let i=0;i<32;i++){ const hgt = 4 + Math.random()*14; h += `<span style="height:${hgt}px"></span>`; }
  c.innerHTML = h;
}

// ============ 页面导航 ============
function navigate(target){
  if(sproutTimer){ clearTimeout(sproutTimer); sproutTimer = null; }
  const map = {home:'s-home',journal:'s-journal',sprout:'s-sprout',echo:'s-echo',archive:'s-archive'};
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(map[target]).classList.add('active');
  curScreen = target;
  // 底部导航高亮
  const navTarget = (target==='home')?'home':(target==='journal')?'journal':(target==='archive')?'archive':null;
  document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
  if(navTarget){
    const idx = ['home','journal','archive'].indexOf(navTarget);
    document.querySelectorAll('.bnav-item')[idx]?.classList.add('active');
  }
  // 发芽页自动跳转
  if(target==='sprout'){
    const dur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sprout-duration')) * 1000;
    sproutTimer = setTimeout(()=> navigate('echo'), dur);
  }
}

function togglePlay(btn){
  const svg = btn.querySelector('svg');
  if(btn.dataset.playing === '1'){ btn.dataset.playing='0'; svg.innerHTML='<polygon points="4,2 14,8 4,14"/>'; }
  else { btn.dataset.playing='1'; svg.innerHTML='<rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/>'; }
}

// ============ 分层切换 ============
document.querySelectorAll('.tier-btn').forEach(b => {
  b.addEventListener('click', () => { stopAuto(); applyTier(b.dataset.tier); });
});
function stopAuto(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; document.getElementById('autoCycle').checked=false; }
}
document.getElementById('autoCycle').addEventListener('change', e => {
  if(e.target.checked){
    let i = tierOrder.indexOf(curTier);
    autoTimer = setInterval(() => { i=(i+1)%tierOrder.length; applyTier(tierOrder[i]); }, 3000);
  } else if(autoTimer){ clearInterval(autoTimer); autoTimer=null; }
});

// ============ 初始化 ============
applyTier('youth');
navigate('home');
</script>
</body>
</html>
